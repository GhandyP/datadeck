<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataDeck — draft deck</title>
<!--DATADECK:STYLE-->
</head>
<body>
<a class="skip" href="#slides">Skip to the slides</a>

<header class="band">
  <span class="band__code dd-code" id="deck-code">EX-000000</span>
  <span class="band__title" id="deck-title">Deck</span>
  <span class="band__draft dd-code" id="deck-draft">Draft</span>
</header>

<main class="slides" id="slides" tabindex="-1"></main>

<footer class="controls">
  <button class="control" id="prev" type="button">Previous</button>
  <ol class="index" id="index" aria-label="Slides"></ol>
  <button class="control" id="next" type="button">Next</button>
  <p class="counter dd-num" id="counter" aria-live="polite"></p>
</footer>

<noscript>
  <p class="fallback">This deck needs JavaScript to lay out its slides. Every
  figure it shows is also listed in the source table below each claim.</p>
</noscript>

<!--DATADECK:DATA-->
<!--DATADECK:SCRIPT-->
</body>
</html>
